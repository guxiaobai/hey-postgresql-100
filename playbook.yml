---
- hosts: all
  vars:
    postgres_version: 16
    # 网络访问配置
    postgres_listen_addresses: "*"
    # 172.16.0.0/16(aliyun vpc)
    # 192.168.100.0/24(Hi)
    postgres_allow_cidr: "0.0.0.0/0"  # 可改成你的内网网段

    
   
  
  handlers:
    - name: Restart PostgreSQL
      service: name=postgresql@{{ postgres_version}}-main.service state=restarted

  tasks:
    - name : add postgresql repo
      deb822_repository:
        types: ["deb", "deb-src"]
        # https://apt.postgresql.org/pub/repos/apt
        uris: https://mirrors.aliyun.com/postgresql/repos/apt/
        suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
        architectures: amd64
        components: main
        # https://www.postgresql.org/media/keys/ACCC4CF8.asc
        signed_by: https://mirrors.aliyun.com/postgresql/repos/apt/ACCC4CF8.asc
        name: pgdg
        

    - name: install postgresql
      apt:
        name: "{{ item }}"
        state: present
      with_items:
        - "postgresql-{{ postgres_version }}"
        - "postgresql-client-{{ postgres_version }}"
        - libpq-dev

    # 08 Connection Settings
    - name: Configure PostgreSQL to listen on all addresses
      lineinfile:
        path: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
        regexp: '^#?listen_addresses\s*='
        line: "listen_addresses = '{{ postgres_listen_addresses | mandatory }}'"
      notify: Restart PostgreSQL

    # 09 Authentication
    - name: Allow remote connections in pg_hba.conf
      lineinfile:
        path: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
        insertafter: EOF
        line: "host    all    all    {{ postgres_allow_cidr | mandatory }}    scram-sha-256"
      notify: Restart PostgreSQL